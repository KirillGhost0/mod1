name: Build construct for space 1.7.10 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'

      - name: Prepare Minecraft Forge
        run: gradle --no-daemon setupDecompWorkspace

      - name: Build JAR
        run: gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: construct-for-space-1.7.10
          path: build/libs/*.jar
          if-no-files-found: error
